# deploiement/nginx-ikarama.conf — Ikarama derrière nginx dans la VM (voir docs/CI-CD.md, étape 7).
# Port 4002 : n'entre pas en conflit avec une autre application (ex. Absences) sur le port 80.
# Installer : sudo cp deploiement/nginx-ikarama.conf /etc/nginx/sites-available/ikarama
#             sudo ln -s /etc/nginx/sites-available/ikarama /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo systemctl reload nginx
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 4002;
    server_name _;
    client_max_body_size 10m;

    # Frontend compilé par le déploiement (npm run build)
    root /home/user/projets/ikarama_v2/frontend/build;
    location / { try_files $uri $uri/ /index.html; }

    # API, administration et fichiers statiques Django
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # WebSocket (temps réel)
    location /ws/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
