<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Icône de l’onglet : fichier de frontend/public/ (servi à la racine du site) -->
    <link rel="icon" type="image/svg+xml" href="/favicon_3.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Ikarama</title>
    <style>
      /* Écran de démarrage (remplacé par l'application une fois prête) */
      #demarrage {
        min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; background: #18355d; color: #fff; font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 24px;
      }
      #demarrage img { width: 64px; height: 64px; }
      .demarrage-titre { font-size: 1.125rem; font-weight: 600; }
      .demarrage-texte { opacity: .8; max-width: 46ch; }
      #demarrage button { margin-top: 8px; background: #fff; color: #18355d; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="demarrage" role="status">
        <img src="/logo_gauche.svg" alt="" />
        <p class="demarrage-titre">Ikarama</p>
        <p class="demarrage-texte">Connexion en cours…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
